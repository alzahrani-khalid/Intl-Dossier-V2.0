name: E2E Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    env:
      CI: true
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ANALYST_EMAIL: ${{ secrets.E2E_ANALYST_EMAIL }}
      E2E_ANALYST_PASSWORD: ${{ secrets.E2E_ANALYST_PASSWORD }}
      E2E_INTAKE_EMAIL: ${{ secrets.E2E_INTAKE_EMAIL }}
      E2E_INTAKE_PASSWORD: ${{ secrets.E2E_INTAKE_PASSWORD }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ matrix.total }} --project=chromium-en --project=chromium-ar-smoke
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 90
      - name: Upload traces & screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.shard }}
          path: |
            test-results/**/*.zip
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 90

  qa-sweep:
    name: QA Sweep (axe / responsive / keyboard / focus-outline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.E2E_ANALYST_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_ANALYST_PASSWORD }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Run QA sweep (Phase 43 — blocking gate)
        run: pnpm -C frontend test:qa-sweep
      - name: Upload sweep failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-sweep-failures
          path: |
            frontend/test-results/**/*.zip
            frontend/test-results/**/*.png
            frontend/test-results/**/*.webm
          retention-days: 90

  visual-regression-phase-46:
    name: Visual Regression (Phase 46)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.E2E_ANALYST_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_ANALYST_PASSWORD }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend exec playwright install chromium
      - name: Run dashboard widget visual baselines
        run: pnpm -C frontend exec playwright test dashboard-widgets --project=chromium-dashboard-widgets
      - name: Run list and drawer visual baselines
        run: pnpm -C frontend exec playwright test list-pages-visual.spec.ts dossier-drawer-visual.spec.ts --project=chromium
      # Promoted 2026-08-13 under ruling RUL120 (CI-04). This spec held committed
      # `-chromium-darwin.png` baselines that NO job executed; six sibling ungated specs were deleted
      # rather than promoted. It earns its gate on three counts: (1) it is the only visual coverage of
      # RTL at the 768 breakpoint anywhere in CI — its matrix is ltr/rtl x 1280/768, where the rest of
      # the visual suite is 1280-only; (2) it pins a PURPOSE-BUILT fixture record
      # (PHASE_52_FIXTURE_ENGAGEMENT_ID, default 00000000-0000-0052-0000-000000000001 — identical to
      # the .env.test value, so this job's fallback resolves it without extra secrets) instead of
      # whatever rows staging happens to hold, which is what VISUAL-DEBT-01 asks visual specs to do;
      # (3) it passes against its ALREADY-COMMITTED baselines on the macOS reference machine
      # (2026-08-13, pinned Node v24.5.0), so promotion needs no re-baseline and does not widen the
      # ORCH-3 sign-off set.
      # Measured honestly, not rounded up: 4/4 in FOUR of FIVE full-spec runs. One run failed
      # `ltr @ 768x1024` alone; that test then passed 3/3 in isolation and the full spec passed 4/4 in
      # three consecutive reruns, and the error text was lost to artifact overwrite before capture — so
      # the RATE is known (1 test-execution in 20) and the MECHANISM is not. This job sets `retries: 2`
      # via playwright.config.ts (`process.env.CI ? 2 : 0`), which covers a flake of that rate. If this
      # step reds in CI, suspect that 768 test first and read the trace before re-baselining anything.
      - name: Run tasks-tab visual baselines (RTL + 768 breakpoint coverage)
        run: pnpm -C frontend exec playwright test tasks-tab-visual.spec.ts --project=chromium

  merge-reports:
    name: Merge Playwright reports
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 90
